name: CI

# Cheap pull-request check: one Ubuntu build of the VST3 target.
# Packaging and releases live in build-release-artifacts.yml, which runs
# only on v* tags.

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBORATO_FETCH_JUCE=ON
          -DBORATO_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build VST3
        run: cmake --build build --target BoratoLA2A_VST3
